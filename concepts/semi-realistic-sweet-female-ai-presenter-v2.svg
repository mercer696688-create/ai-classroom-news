    <path d="M476 332c40-117 138-184 246-167-71 22-139 67-176 131-29 49-66 83-121 104 20-32 35-51 51-68z" fill="url(#hairLight)" opacity=".72"/>
    <path d="M714 172c97 25 159 94 168 194-43-41-85-68-136-83-6-44-16-81-32-111z" fill="#160e0e" opacity=".76"/>
    <path d="M422 378c-39 85-36 181-6 258 13-101 29-171 66-237z" fill="#2b1b18"/>
    <path d="M805 338c45 97 43 202 7 303-8-123-30-201-67-278z" fill="#1b1111"/>

