    <path d="M623 494c-2 38-9 70-25 91 15 11 36 12 52 0" fill="none" stroke="#bd7c70" stroke-width="6" stroke-linecap="round"/>
    <path d="M608 582c11 5 28 5 39 0" fill="none" stroke="#f6c4b3" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/>

    <!-- natural soft smile -->
    <path d="M561 631c33-22 83-22 117 1-31 39-84 44-117-1z" fill="#a95762"/>
    <path d="M568 633c31 12 70 13 103 1-26 10-74 12-103-1z" fill="#f9d6cf"/>
    <path d="M579 653c24 13 54 13 78 0-21 25-59 27-78 0z" fill="#d47d85"/>
    <path d="M565 629c32-17 79-18 111 0" fill="none" stroke="#6c343e" stroke-width="4" stroke-linecap="round"/>

    <!-- gentle AI identity details -->
    <path d="M832 359l14 7 14-7 7 14-7 14-14 7-14-7-7-14z" fill="#88eafc" fill-opacity=".72" stroke="#dcfbff" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="601" cy="1009" r="45" fill="#102d4b" stroke="#7be8fb" stroke-width="4" filter="url(#softGlow)"/>
    <path d="M579 1008l15 15 30-32" fill="none" stroke="#c7fbff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="601" cy="1009" r="33" fill="none" stroke="#8182ff" stroke-opacity=".55" stroke-width="2"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="92" fill="#dffaff" font-size="24" font-weight="700" letter-spacing="4">AI CLASSROOM PRESENTER</text>
    <text x="80" y="130" fill="#7fa3b7" font-size="19">Concept V2 · semi-realistic, warm and approachable</text>
    <g transform="translate(864 94)">
      <rect width="250" height="45" rx="22" fill="#0c2235" stroke="#335d73"/>
      <circle cx="25" cy="22.5" r="6" fill="#68e8be" filter="url(#softGlow)"/>
      <text x="44" y="29" fill="#9ad6e4" font-size="16" letter-spacing="2">PRESENTER MODE</text>
    </g>
  </g>
</svg>
