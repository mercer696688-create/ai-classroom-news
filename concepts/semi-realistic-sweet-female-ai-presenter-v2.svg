    <g clip-path="url(#faceClip)">
      <ellipse cx="512" cy="443" rx="112" ry="178" fill="#fff4ec" opacity=".12"/>
      <ellipse cx="764" cy="518" rx="83" ry="208" fill="#8c433d" opacity=".08"/>
      <ellipse cx="510" cy="604" rx="63" ry="28" fill="#ed8791" opacity=".18"/>
      <ellipse cx="725" cy="604" rx="63" ry="28" fill="#ed8791" opacity=".16"/>
