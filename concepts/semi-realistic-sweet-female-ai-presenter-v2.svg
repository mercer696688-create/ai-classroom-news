    <path d="M362 459C339 250 455 104 620 110c185 6 292 157 244 388l-45 409c-17 143-79 226-173 235 51-132 46-276 5-397-20 10-39 14-58 14-19 0-38-4-57-12-47 118-54 261-7 394-101-18-165-111-178-253z" fill="url(#hair)"/>
