    <path d="M254 1140c22-216 123-329 294-372h104c171 42 272 155 294 372z" fill="url(#jacket)" stroke="#8ddff5" stroke-opacity=".33" stroke-width="3"/>
    <path d="M508 776h185l54 364H454z" fill="url(#blouse)"/>
    <path d="M450 813l109-45 40 126-92 103-91-116z" fill="url(#lapel)"/>
    <path d="M750 813l-109-45-40 126 92 103 91-116z" fill="url(#lapel)"/>
    <path d="M529 785l70 89 72-89-22 164h-99z" fill="#f7fcff"/>
    <path d="M297 1139c12-158 69-254 153-297l70 298zM903 1139c-12-158-69-254-153-297l-70 298z" fill="#2b3b66" opacity=".88"/>

    <!-- neck -->
    <path d="M532 699h135v111c-18 43-113 43-135 0z" fill="url(#neck)"/>
    <path d="M536 711c35 24 91 24 127 0v33c-34 29-95 30-127 1z" fill="#a9675d" opacity=".16"/>

    <!-- ears -->
    <ellipse cx="421" cy="489" rx="34" ry="60" fill="#d99a88"/>
    <ellipse cx="805" cy="489" rx="34" ry="60" fill="#c98577"/>
    <path d="M420 477c-15 9-15 30-1 39" fill="none" stroke="#a9635d" stroke-width="5" stroke-linecap="round"/>
    <path d="M806 477c15 9 15 30 1 39" fill="none" stroke="#a9635d" stroke-width="5" stroke-linecap="round"/>
    <path d="M421 545v37M805 545v37" stroke="#a8eaff" stroke-width="3"/>
    <circle cx="421" cy="590" r="9" fill="#c5f7ff" stroke="#75dff7" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="805" cy="590" r="9" fill="#d8d2ff" stroke="#9e95ff" stroke-width="3" filter="url(#softGlow)"/>

