    <path d="M474 490c29-37 95-41 133-2-34 31-94 33-133 2z" fill="#fffafa"/>
    <path d="M653 490c34-37 97-35 129 3-37 29-93 28-129-3z" fill="#fffafa"/>
    <path d="M473 488c35-35 95-37 134 0M652 488c38-35 96-33 131 5" fill="none" stroke="#442d2e" stroke-width="7" stroke-linecap="round"/>
    <path d="M479 479l-18-15M486 473l-11-20M774 478l17-15M767 472l11-20" stroke="#3a272a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="546" cy="489" rx="27" ry="31" fill="url(#iris)"/>
    <ellipse cx="710" cy="490" rx="27" ry="31" fill="url(#iris)"/>
    <ellipse cx="547" cy="491" rx="13" ry="19" fill="#100b0b"/>
    <ellipse cx="710" cy="492" rx="13" ry="19" fill="#100b0b"/>
    <circle cx="536" cy="478" r="8" fill="#ffffff"/>
    <circle cx="700" cy="479" r="8" fill="#ffffff"/>
    <circle cx="554" cy="503" r="4" fill="#e9d9c8" opacity=".76"/>
    <circle cx="717" cy="504" r="4" fill="#e9d9c8" opacity=".76"/>
    <path d="M481 511c31 13 85 12 118-3M659 510c31 13 82 13 114-1" fill="none" stroke="#b27f77" stroke-opacity=".42" stroke-width="3"/>

