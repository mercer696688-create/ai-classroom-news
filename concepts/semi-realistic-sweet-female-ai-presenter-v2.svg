<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#183653"/>
      <stop offset="0.52" stop-color="#091a2d"/>
      <stop offset="1" stop-color="#030912"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#6ce5ff" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#7178ff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#101d35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80604f"/>
      <stop offset=".18" stop-color="#493329"/>
      <stop offset=".55" stop-color="#241713"/>
      <stop offset="1" stop-color="#100a0a"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c39475" stop-opacity=".78"/>
      <stop offset=".35" stop-color="#68483a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1a1010" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skin" cx="42%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fff2e9"/>
      <stop offset=".44" stop-color="#f4d0c2"/>
      <stop offset=".78" stop-color="#d99b88"/>
      <stop offset="1" stop-color="#b86f62"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c88778"/>
      <stop offset=".45" stop-color="#efc0ae"/>
      <stop offset="1" stop-color="#bb776a"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#607eb4"/>
      <stop offset=".45" stop-color="#334870"/>
      <stop offset="1" stop-color="#151b38"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a2b9e4"/>
      <stop offset=".45" stop-color="#5d76aa"/>
      <stop offset="1" stop-color="#29365f"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecf5"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="32%" r="72%">
      <stop offset="0" stop-color="#b88c67"/>
      <stop offset=".48" stop-color="#6a4531"/>
      <stop offset="1" stop-color="#1d1110"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#00040a" flood-opacity=".62"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="skinSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
    <clipPath id="faceClip"><path d="M431 351C455 222 549 170 650 185c116 17 178 105 164 244l-9 139c-10 137-93 230-207 225-113-5-188-106-188-239z"/></clipPath>
  </defs>

  <rect width="1200" height="1200" rx="70" fill="url(#background)"/>
  <ellipse cx="600" cy="560" rx="520" ry="490" fill="url(#halo)"/>
  <path d="M120 280h160M920 280h160M120 920h160M920 920h160" stroke="#62daf1" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="600" cy="560" r="433" fill="none" stroke="#5fdcf5" stroke-opacity=".16" stroke-width="3"/>
  <circle cx="600" cy="560" r="370" fill="none" stroke="#8182ff" stroke-opacity=".14" stroke-width="2" stroke-dasharray="8 20"/>
  <ellipse cx="600" cy="1110" rx="342" ry="58" fill="#00040a" opacity=".6"/>

