    <path d="M483 435c42-25 87-23 123 3" fill="none" stroke="#4e342f" stroke-width="10" stroke-linecap="round"/>
    <path d="M657 439c39-26 83-27 119-4" fill="none" stroke="#4e342f" stroke-width="10" stroke-linecap="round"/>
    <path d="M487 432c34-17 73-19 108-3" fill="none" stroke="#a37968" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>

