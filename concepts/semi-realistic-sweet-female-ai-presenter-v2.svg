    <path d="M839 425c51 190 22 401-87 598-25 45-65 62-98 42 84-164 87-365 27-533z" fill="#170e0f"/>
    <path d="M388 365c39-132 137-221 253-222 108-1 190 58 229 172-109-67-247-88-372-13-48 29-81 56-110 63z" fill="url(#hairLight)" opacity=".72"/>

