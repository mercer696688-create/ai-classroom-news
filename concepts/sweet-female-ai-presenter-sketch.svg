<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#173955"/>
      <stop offset="0.55" stop-color="#091d31"/>
      <stop offset="1" stop-color="#040c18"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5269a8"/>
      <stop offset="0.42" stop-color="#293d73"/>
      <stop offset="1" stop-color="#141f48"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0cf"/>
      <stop offset="0.55" stop-color="#f5b69f"/>
      <stop offset="1" stop-color="#d9887a"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91edff"/>
      <stop offset="0.5" stop-color="#6785d8"/>
      <stop offset="1" stop-color="#4b3b91"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff8ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000b18" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="70" fill="url(#bg)"/>
  <circle cx="600" cy="560" r="395" fill="none" stroke="#62dff5" stroke-opacity="0.28" stroke-width="4"/>
  <circle cx="600" cy="560" r="325" fill="none" stroke="#9d83ff" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="9 18"/>
  <ellipse cx="600" cy="1045" rx="285" ry="55" fill="#000711" opacity="0.48"/>

  <g filter="url(#soft)">
    <!-- long soft hair behind the face -->
    <path d="M398 520C385 328 456 185 601 180c158-5 239 126 213 341l-38 312c-25 88-96 133-176 134-84 1-162-49-188-139z" fill="url(#hair)"/>
    <path d="M421 506c-40 145-17 315 36 430 32 69 88 83 121 32-79-121-77-294-42-408z" fill="#1d2c5a"/>
    <path d="M778 506c42 145 18 315-35 430-32 69-89 83-121 32 79-121 77-294 41-408z" fill="#17264f"/>

    <!-- body -->
    <path d="M346 1090c14-184 83-300 217-329h75c135 28 204 145 218 329z" fill="url(#jacket)" stroke="#9eeeff" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M508 765h184l-20 325H528z" fill="url(#blouse)"/>
    <path d="M507 766l80 98-64 84-71-137zM693 766l-80 98 64 84 71-137z" fill="#5269aa" opacity="0.86"/>
    <path d="M540 822l60 59 60-59-22 141h-76z" fill="#f1fbff"/>
    <path d="M447 816c-64 36-102 126-108 274h126l35-242zM753 816c64 36 102 126 108 274H735l-35-242z" fill="#5c65b4"/>

    <!-- neck -->
    <path d="M545 685h110v122c-22 34-86 34-110 0z" fill="url(#skin)"/>

    <!-- ears and earrings -->
    <ellipse cx="420" cy="503" rx="35" ry="57" fill="#ecaa96"/>
    <ellipse cx="780" cy="503" rx="35" ry="57" fill="#d98f82"/>
    <circle cx="420" cy="568" r="13" fill="#72eaff" filter="url(#glow)"/>
    <circle cx="780" cy="568" r="13" fill="#b595ff" filter="url(#glow)"/>

    <!-- face -->
    <path d="M432 438c0-133 69-220 169-220 104 0 169 87 169 220v120c0 118-76 203-170 203-95 0-168-85-168-203z" fill="url(#skin)" stroke="#ffe3d7" stroke-opacity="0.55" stroke-width="4"/>

    <!-- sweet side-swept fringe -->
    <path d="M411 449c-10-176 75-277 200-271 89 4 157 64 178 162-76-51-159-65-248-28-31 13-74 63-130 137z" fill="url(#hair)"/>
    <path d="M453 405c38-115 133-170 247-142-59 26-112 65-145 129-34 65-62 82-102 92z" fill="#40558e" opacity="0.85"/>
    <path d="M729 299c75 21 121 82 132 159-34-22-63-36-91-42-9-45-22-82-41-117z" fill="#9d83ff" opacity="0.32"/>

    <!-- star hair clip -->
    <path d="M760 328l12 23 26 4-19 18 5 26-24-12-23 12 4-26-18-18 26-4z" fill="#8ff5ff" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>

    <!-- brows -->
    <path d="M478 465c38-24 80-22 111 1" fill="none" stroke="#69414e" stroke-width="11" stroke-linecap="round"/>
    <path d="M622 466c33-24 75-26 108-2" fill="none" stroke="#69414e" stroke-width="11" stroke-linecap="round"/>

    <!-- large warm eyes -->
    <ellipse cx="534" cy="513" rx="57" ry="42" fill="#fffaf6"/>
    <ellipse cx="668" cy="513" rx="57" ry="42" fill="#fffaf6"/>
    <ellipse cx="541" cy="515" rx="27" ry="31" fill="#55c9df"/>
    <ellipse cx="661" cy="515" rx="27" ry="31" fill="#55c9df"/>
    <ellipse cx="541" cy="518" rx="14" ry="20" fill="#10263a"/>
    <ellipse cx="661" cy="518" rx="14" ry="20" fill="#10263a"/>
    <circle cx="532" cy="503" r="9" fill="#ffffff"/>
    <circle cx="652" cy="503" r="9" fill="#ffffff"/>
    <path d="M478 500c-8-10-13-19-15-27M481 493c-13-5-22-12-29-21M724 500c8-10 13-19 15-27M721 493c13-5 22-12 29-21" stroke="#51313c" stroke-width="5" stroke-linecap="round"/>

    <!-- nose, blush, smile -->
    <path d="M598 526c-3 35-8 54-20 68 13 9 31 8 43 0" fill="none" stroke="#c47b70" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="492" cy="597" rx="51" ry="22" fill="#ef788b" opacity="0.3"/>
    <ellipse cx="708" cy="597" rx="51" ry="22" fill="#ef788b" opacity="0.3"/>
    <path d="M548 630c31 29 74 29 105 0-18 48-82 59-105 0z" fill="#a84d68"/>
    <path d="M560 637c24 15 58 15 81 0-20 26-61 28-81 0z" fill="#ffb0bd"/>

    <!-- AI core and hands -->
    <circle cx="600" cy="970" r="48" fill="#123e65" stroke="#8ff5ff" stroke-width="5" filter="url(#glow)"/>
    <path d="M600 943l9 18 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#d4fdff"/>
    <path d="M382 1075c-20-45-22-89 4-116 23-24 57-7 65 30l15 86zM818 1075c20-45 22-89-4-116-23-24-57-7-65 30l-15 86z" fill="url(#skin)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="90" fill="#eafcff" font-size="42" font-weight="700">Sweet AI Classroom Presenter</text>
    <text x="600" y="138" fill="#91bbca" font-size="25">2.5D concept sketch · friendly, youthful, warm</text>
  </g>
</svg>
