<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#fff9ff"/>
      <stop offset=".45" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#cadcf3"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6a56"/>
      <stop offset=".28" stop-color="#5b4035"/>
      <stop offset=".68" stop-color="#30201d"/>
      <stop offset="1" stop-color="#160e10"/>
    </linearGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e1b494" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#98705b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skin" cx="43%" cy="26%" r="78%">
      <stop offset="0" stop-color="#fffaf7"/>
      <stop offset=".42" stop-color="#fbe3d9"/>
      <stop offset=".78" stop-color="#e8b7a7"/>
      <stop offset="1" stop-color="#ca8d80"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d79c8e"/>
      <stop offset=".45" stop-color="#f5cbbc"/>
      <stop offset="1" stop-color="#cf8f84"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d8ff"/>
      <stop offset=".48" stop-color="#aaa9e5"/>
      <stop offset="1" stop-color="#716fae"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/>
      <stop offset="1" stop-color="#bfc2ee"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="28%" r="70%">
      <stop offset="0" stop-color="#d7b18c"/>
      <stop offset=".45" stop-color="#8c5e45"/>
      <stop offset="1" stop-color="#2b1716"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#6d6a92" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="70" fill="url(#bg)"/>
  <circle cx="175" cy="185" r="115" fill="#f7d9ff" opacity=".34"/>
  <circle cx="1020" cy="260" r="150" fill="#b9eaff" opacity=".28"/>
  <circle cx="960" cy="970" r="190" fill="#d6d1ff" opacity=".24"/>
  <path d="M110 310c140-120 275-121 405-7M690 212c146-69 276-50 390 58" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
  <ellipse cx="600" cy="1105" rx="320" ry="55" fill="#6b6b8b" opacity=".18"/>

  <g filter="url(#shadow)">
    <!-- soft long wavy hair -->
    <path d="M360 482C328 259 439 99 605 96c179-3 301 147 264 384l-43 415c-12 139-76 222-174 247 49-143 41-276 1-397-18 8-38 12-59 12-20 0-40-4-58-12-47 122-55 256-10 399-102-23-164-112-177-250z" fill="url(#hair)"/>
    <path d="M385 476c-39 169-12 361 69 537 23 50 57 74 90 59-62-165-60-346-8-502z" fill="#28181a"/>
    <path d="M838 475c43 173 16 367-70 544-24 49-61 71-94 53 67-166 64-352 9-509z" fill="#211416"/>
    <path d="M393 332c49-140 152-220 268-218 108 1 196 61 232 176-90-65-199-86-313-42-72 28-131 82-187 84z" fill="url(#hairShine)" opacity=".66"/>
    <path d="M393 580c-33 164-9 337 65 494M806 576c37 164 11 338-68 499" fill="none" stroke="#ad7e65" stroke-opacity=".25" stroke-width="19" stroke-linecap="round"/>

    <!-- pastel presenter outfit -->
    <path d="M272 1140c22-207 121-315 284-358h88c164 43 263 151 284 358z" fill="url(#jacket)" stroke="#f7f6ff" stroke-width="4"/>
    <path d="M510 788h180l47 352H463z" fill="#fff"/>
    <path d="M455 824l105-44 41 120-91 103-91-111z" fill="url(#lapel)"/>
    <path d="M745 824l-105-44-41 120 91 103 91-111z" fill="url(#lapel)"/>
    <path d="M535 800l65 81 66-81-18 143h-95z" fill="#fff"/>
    <path d="M319 1138c13-142 65-238 138-282l62 283zM881 1138c-13-142-65-238-138-282l-62 283z" fill="#9697d2" opacity=".82"/>

