    <path d="M548 704h105v108c-19 35-87 35-105 0z" fill="url(#neck)"/>
    <path d="M550 717c28 18 74 19 101 0v28c-26 22-75 23-101 1z" fill="#b8736c" opacity=".12"/>

    <!-- ears and delicate earrings -->
    <ellipse cx="431" cy="496" rx="29" ry="55" fill="#e7b2a4"/>
    <ellipse cx="769" cy="496" rx="29" ry="55" fill="#d69b90"/>
    <path d="M431 542v31M769 542v31" stroke="#a48bd6" stroke-width="3"/>
    <path d="M431 578l8 13-8 13-8-13zM769 578l8 13-8 13-8-13z" fill="#e7e1ff" stroke="#9f96dd" stroke-width="2" filter="url(#glow)"/>

    <!-- small oval face with pointed chin -->
    <path d="M429 352C451 224 537 166 625 177c104 13 166 96 157 225l-7 151c-6 128-75 225-174 239-99-13-171-108-179-235z" fill="url(#skin)" stroke="#fff0e9" stroke-width="4"/>
    <ellipse cx="508" cy="600" rx="52" ry="22" fill="#f18b9b" opacity=".18"/>
    <ellipse cx="701" cy="600" rx="52" ry="22" fill="#f18b9b" opacity=".16"/>

    <!-- natural side part, airy fringe -->
    <path d="M392 402c2-177 104-297 245-294 126 3 219 87 237 218-79-59-169-80-264-50-82 26-147 80-218 126z" fill="url(#hair)"/>
    <path d="M462 342c38-114 131-185 238-176-69 27-125 67-162 124-31 49-68 82-121 111 19-28 31-42 45-59z" fill="url(#hairShine)" opacity=".82"/>
    <path d="M704 168c93 22 156 90 170 187-35-33-73-57-113-71-11-49-29-89-57-116z" fill="#231719" opacity=".73"/>
    <path d="M412 382c-25 72-27 150-4 229 12-88 34-154 69-212z" fill="#3b2825"/>
    <path d="M778 337c35 88 38 179 12 271-13-104-33-174-67-237z" fill="#2a1b1c"/>

    <!-- soft curved brows -->
    <path d="M487 433c38-21 79-20 111 2" fill="none" stroke="#654842" stroke-width="8" stroke-linecap="round"/>
    <path d="M643 436c34-23 76-23 109-2" fill="none" stroke="#654842" stroke-width="8" stroke-linecap="round"/>

