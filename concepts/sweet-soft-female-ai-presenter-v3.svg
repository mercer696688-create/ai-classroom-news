    <path d="M638 488c33-35 88-33 119 3-33 27-85 26-119-3z" fill="#fffdfd"/>
    <path d="M476 486c31-33 88-36 124 0M637 487c36-34 87-31 121 4" fill="none" stroke="#4b3335" stroke-width="6" stroke-linecap="round"/>
    <path d="M481 477l-14-12M489 472l-8-17M751 478l14-12M744 472l8-17" stroke="#4a3235" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="542" cy="487" rx="25" ry="29" fill="url(#iris)"/>
    <ellipse cx="697" cy="488" rx="25" ry="29" fill="url(#iris)"/>
    <ellipse cx="542" cy="489" rx="12" ry="18" fill="#150c0d"/>
    <ellipse cx="697" cy="490" rx="12" ry="18" fill="#150c0d"/>
    <circle cx="533" cy="477" r="8" fill="#fff"/>
    <circle cx="688" cy="478" r="8" fill="#fff"/>
    <circle cx="550" cy="500" r="4" fill="#f2d6c2"/>
    <circle cx="705" cy="501" r="4" fill="#f2d6c2"/>

    <!-- petite nose -->
    <path d="M608 501c-1 34-7 58-18 75 11 8 28 9 40 0" fill="none" stroke="#c9897d" stroke-width="5" stroke-linecap="round"/>
    <path d="M598 574c8 4 21 4 29 0" fill="none" stroke="#fff0e7" stroke-width="3" stroke-linecap="round"/>

    <!-- small gentle smile -->
    <path d="M558 624c28-18 67-18 95 1-25 31-69 35-95-1z" fill="#b65f72"/>
    <path d="M565 626c25 9 56 10 81 1-22 8-59 9-81-1z" fill="#ffe7e3"/>
    <path d="M573 642c19 11 46 11 65 0-17 20-49 22-65 0z" fill="#dc8797"/>
    <path d="M561 622c27-14 65-15 90 1" fill="none" stroke="#7c3d4e" stroke-width="3" stroke-linecap="round"/>

    <!-- subtle AI detail only -->
    <path d="M791 373c13-14 29-14 42 0-3 20-18 31-21 33-4-2-19-13-21-33z" fill="#c4f5ff" stroke="#83dcec" stroke-width="3" filter="url(#glow)"/>
    <path d="M579 1018l21 18 22-18" fill="none" stroke="#7770bd" stroke-width="5" stroke-linecap="round"/>
    <circle cx="600" cy="1021" r="34" fill="none" stroke="#a9dff0" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="86" fill="#524f79" font-size="23" font-weight="750" letter-spacing="3.5">SWEET AI CLASSROOM HOST</text>
    <text x="74" y="122" fill="#8582a6" font-size="18">Concept V3 · soft, youthful, friendly</text>
    <g transform="translate(900 78)">
      <rect width="225" height="43" rx="21" fill="#ffffff" fill-opacity=".62" stroke="#bbb9df"/>
      <circle cx="24" cy="21.5" r="6" fill="#7bdcbf"/>
      <text x="42" y="28" fill="#77749d" font-size="15" letter-spacing="1.5">CLASSROOM READY</text>
    </g>
  </g>
</svg>
